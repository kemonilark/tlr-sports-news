
name: TLR All Sports News

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tlr-sports-news
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Run sports news automation
        env:
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 sports_news.py

      - name: Save posted article history
        run: |
          if [ -f posted_articles.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_articles.json
            if ! git diff --cached --quiet; then
              git commit -m "Update posted sports news"
              git push
            fi
          fi
